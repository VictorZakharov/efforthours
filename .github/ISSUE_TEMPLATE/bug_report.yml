name: Bug report
description: Report incorrect analysis, output, or CLI behavior
title: "[Bug]: "
labels:
  - type:quality
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Fairbill. Do not attach private repositories,
        credentials, client evidence, or proprietary source. Prefer a small synthetic
        reproduction that you have the right to share.

  - type: input
    id: version
    attributes:
      label: Fairbill version
      description: Run `fairbill version` and paste the result.
      placeholder: 0.8.0-alpha.2
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and safe inputs
      description: Redact local paths and identifying repository details when necessary.
      render: shell
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproducible example
      description: Synthetic source, evidence IDs, or a public repository revision are preferred.

  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed credentials, private client material, and proprietary source from this report.
          required: true
