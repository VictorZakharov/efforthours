name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  pull-request-history:
    name: Pull request commits are linear
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.change_scope.outputs.full_ci }}
      skip_reason: ${{ steps.change_scope.outputs.skip_reason }}

    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify validation scope
        id: change_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          skip_reason=""

          if [ "$EVENT_NAME" = "push" ]; then
            set +e
            provenance="$(pwsh -NoLogo -NoProfile -File eng/verify-tested-merge.ps1 -Commit HEAD 2>&1)"
            provenance_status=$?
            set -e

            case "$provenance_status" in
              0)
                echo "$provenance"
                if grep -Fxq "tree_matches_pr_head=true" <<< "$provenance"; then
                  merge_commit="$(sed -n 's/^merge_commit=//p' <<< "$provenance")"
                  pr_head="$(sed -n 's/^pr_head=//p' <<< "$provenance")"
                  merged_pr_count=0
                  while IFS=$'\t' read -r api_merge api_head api_base api_merged_at; do
                    if [ "$api_merge" = "$merge_commit" ] && \
                       [ "$api_head" = "$pr_head" ] && \
                       [ "$api_base" = "main" ] && \
                       [ -n "$api_merged_at" ]; then
                      merged_pr_count=$((merged_pr_count + 1))
                    fi
                  done <<< "$(
                    gh api "repos/$GITHUB_REPOSITORY/commits/$merge_commit/pulls?per_page=100" \
                      --jq '.[]|[.merge_commit_sha,.head.sha,.base.ref,.merged_at]|@tsv'
                  )"
                  if [ "$merged_pr_count" -eq 1 ]; then
                    full_ci=false
                    skip_reason="Merged tree is identical to its GitHub-verified required-check PR head; duplicate post-merge validation is not required."
                  else
                    full_ci=true
                    echo "GitHub did not identify exactly one matching merged main PR; full post-merge CI is required."
                  fi
                else
                  full_ci=true
                  echo "Merged tree includes parallel main changes; full post-merge CI is required."
                fi
                ;;
              2)
                full_ci=true
                echo "$provenance"
                echo "Push is not an unchanged tested-PR merge; full CI is required."
                ;;
              *)
                echo "::error::Unable to verify post-merge provenance."
                echo "$provenance"
                exit "$provenance_status"
                ;;
            esac

            echo "full_ci=$full_ci" >> "$GITHUB_OUTPUT"
            echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "full_ci=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            echo "Non-pull-request run; full CI is required."
            exit 0
          fi

          if git diff --quiet --no-renames "$BASE_SHA...$HEAD_SHA" -- . \
            ':(exclude,icase,glob)**/*.md'; then
            full_ci=false
            skip_reason="Markdown-only pull request; expensive CI jobs are not required."
            echo "$skip_reason"
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then
              echo "::error::Unable to classify the pull request diff."
              exit "$diff_status"
            fi

            full_ci=true
            echo "A non-Markdown path changed; full CI is required."
          fi
          echo "full_ci=$full_ci" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"

      - name: Reject merge commits in the pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_count="$(git rev-list --count --merges "$BASE_SHA..$HEAD_SHA")"
          if [ "$merge_count" -ne 0 ]; then
            echo "::error::Pull request branches must be rebased and contain no merge commits ($merge_count found)."
            exit 1
          fi

  formatting:
    name: Formatting
    needs: pull-request-history
    if: needs.pull-request-history.outputs.full_ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EffortHours.slnx --configfile NuGet.Config --locked-mode

      - name: Verify formatting
        run: dotnet format EffortHours.slnx --no-restore --verify-no-changes --severity info

  quality:
    name: Quality (${{ matrix.os }})
    needs: pull-request-history
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Reuse completed validation
        if: needs.pull-request-history.outputs.full_ci != 'true'
        env:
          SKIP_REASON: ${{ needs.pull-request-history.outputs.skip_reason }}
        run: echo "$SKIP_REASON"

      - name: Check out source
        if: needs.pull-request-history.outputs.full_ci == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        if: needs.pull-request-history.outputs.full_ci == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        if: needs.pull-request-history.outputs.full_ci == 'true'
        run: dotnet restore EffortHours.slnx --configfile NuGet.Config --locked-mode

      - name: Build
        if: needs.pull-request-history.outputs.full_ci == 'true'
        run: dotnet build EffortHours.slnx --no-restore --configuration Release

      - name: Run storage-independent unit tests
        if: needs.pull-request-history.outputs.full_ci == 'true'
        run: dotnet test tests/EffortHours.Tests/EffortHours.Tests.csproj --no-build --no-restore --configuration Release

  end-to-end:
    name: End-to-end (${{ matrix.os }})
    needs: pull-request-history
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Reuse completed validation
        if: needs.pull-request-history.outputs.full_ci != 'true'
        env:
          SKIP_REASON: ${{ needs.pull-request-history.outputs.skip_reason }}
        run: echo "$SKIP_REASON"

      - name: Check out source
        if: needs.pull-request-history.outputs.full_ci == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        if: needs.pull-request-history.outputs.full_ci == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore end-to-end project graph
        if: needs.pull-request-history.outputs.full_ci == 'true'
        run: dotnet restore tests/EffortHours.EndToEndTests/EffortHours.EndToEndTests.csproj --configfile NuGet.Config --locked-mode

      - name: Build end-to-end project graph
        if: needs.pull-request-history.outputs.full_ci == 'true'
        run: dotnet build tests/EffortHours.EndToEndTests/EffortHours.EndToEndTests.csproj --no-restore --configuration Release

      - name: Run process-level end-to-end tests
        if: needs.pull-request-history.outputs.full_ci == 'true'
        run: dotnet test tests/EffortHours.EndToEndTests/EffortHours.EndToEndTests.csproj --no-build --no-restore --configuration Release

  package-candidate:
    name: Build preview package candidate
    needs: pull-request-history
    if: needs.pull-request-history.outputs.full_ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/EffortHours.Cli/EffortHours.Cli.csproj --configfile NuGet.Config --locked-mode

      - name: Pack
        run: dotnet pack src/EffortHours.Cli/EffortHours.Cli.csproj --configuration Release --no-restore --output artifacts/package-candidate

      - name: Upload run-scoped package candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: efforthours-tool-candidate-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/package-candidate/EffortHours.Tool.*.nupkg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package:
    name: Pack preview artifact
    needs:
      - pull-request-history
      - formatting
      - quality
      - end-to-end
      - package-candidate
    if: needs.pull-request-history.outputs.full_ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download exact-run package candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: efforthours-tool-candidate-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/packages

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: efforthours-tool-${{ github.sha }}
          path: artifacts/packages/EffortHours.Tool.*.nupkg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
