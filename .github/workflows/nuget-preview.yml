name: NuGet preview

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified prerelease package to NuGet.org
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  package:
    name: Build and verify preview
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package_version.outputs.value }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Read and validate package version
        id: package_version
        shell: bash
        run: |
          version="$(dotnet msbuild src/Fairbill.Cli/Fairbill.Cli.csproj -getProperty:Version -nologo)"
          if [[ -z "$version" || "$version" != *-* ]]; then
            echo "NuGet preview requires an explicit prerelease version; received '$version'." >&2
            exit 1
          fi
          if [[ "${{ inputs.publish }}" == "true" && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "Publishing requires the exact tag 'v$version'; received '$GITHUB_REF'." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Fairbill.slnx --configfile NuGet.Config --force-evaluate

      - name: Verify formatting
        run: dotnet format Fairbill.slnx --no-restore --verify-no-changes --severity info

      - name: Build
        run: dotnet build Fairbill.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/Fairbill.Tests/Fairbill.Tests.csproj --no-build --no-restore --configuration Release

      - name: Run end-to-end tests
        run: dotnet test tests/Fairbill.EndToEndTests/Fairbill.EndToEndTests.csproj --no-build --no-restore --configuration Release

      - name: Pack
        run: dotnet pack src/Fairbill.Cli/Fairbill.Cli.csproj --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Inspect package payload
        shell: bash
        run: |
          package="artifacts/packages/Fairbill.Tool.${{ steps.package_version.outputs.value }}.nupkg"
          test -f "$package"
          entries="$(unzip -Z1 "$package")"
          for required in \
            Fairbill.Tool.nuspec \
            LICENSE \
            PACKAGE_README.md \
            THIRD-PARTY-NOTICES.md \
            models/seed-rules/0.2.1.json \
            rates/us-senior-contractor/2026.1.json \
            tools/net10.0/any/fairbill.dll; do
            grep -Fxq "$required" <<< "$entries"
          done

      - name: Install and run packed tool
        shell: bash
        run: |
          dotnet tool install Fairbill.Tool \
            --tool-path artifacts/smoke-tool \
            --source "$(pwd)/artifacts/packages" \
            --configfile NuGet.Config \
            --version "${{ steps.package_version.outputs.value }}"
          artifacts/smoke-tool/fairbill version
          artifacts/smoke-tool/fairbill --help >/dev/null
          artifacts/smoke-tool/fairbill schema list >/dev/null

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fairbill-tool-${{ steps.package_version.outputs.value }}
          path: artifacts/packages/Fairbill.Tool.${{ steps.package_version.outputs.value }}.nupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to NuGet.org
    if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/v') }}
    needs: package
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fairbill-tool-${{ needs.package.outputs.version }}
          path: artifacts/packages

      - name: Request short-lived NuGet credential
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish immutable preview version
        shell: bash
        run: |
          dotnet nuget push \
            "artifacts/packages/Fairbill.Tool.${{ needs.package.outputs.version }}.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
