name: NuGet release

on:
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  pull-requests: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.package_digest.outputs.value }}
      version: ${{ steps.package_version.outputs.value }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "NuGet release must run from a version tag; received '$GITHUB_REF'." >&2
            exit 1
          fi

      - name: Verify tested release merge
        id: provenance
        shell: pwsh
        run: |
          $provenance = @(& ./eng/verify-tested-merge.ps1 -Commit HEAD)
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $requiredKeys = @(
            "merge_commit",
            "pr_head",
            "tree",
            "tree_matches_pr_head",
            "validation_commit"
          )
          if ($provenance.Count -ne $requiredKeys.Count) {
            throw "Expected $($requiredKeys.Count) provenance outputs; found $($provenance.Count)."
          }

          $values = @{}
          foreach ($line in $provenance) {
            $parts = $line -split "=", 2
            if ($parts.Count -ne 2 -or [string]::IsNullOrWhiteSpace($parts[1])) {
              throw "Malformed provenance output '$line'."
            }

            $key, $value = $parts
            if ($values.ContainsKey($key)) {
              throw "Duplicate provenance output '$key'."
            }

            $values[$key] = $value
          }

          foreach ($key in $requiredKeys) {
            if (-not $values.ContainsKey($key)) {
              throw "Provenance output is missing required key '$key'."
            }

            "$key=$($values[$key])" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          @(
            "### Release provenance",
            "- Merge commit: ``$($values.merge_commit)``",
            "- Tested PR head: ``$($values.pr_head)``",
            "- Merge tree: ``$($values.tree)``",
            "- Tree matches PR head: ``$($values.tree_matches_pr_head)``",
            "- Required-check commit: ``$($values.validation_commit)``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Verify merged pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT: ${{ steps.provenance.outputs.merge_commit }}
          PR_HEAD: ${{ steps.provenance.outputs.pr_head }}
        run: |
          $json = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:MERGE_COMMIT/pulls"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $pullRequests = @(($json | ConvertFrom-Json) | Where-Object {
            $_.merged_at -and
            $_.merge_commit_sha -eq $env:MERGE_COMMIT -and
            $_.head.sha -eq $env:PR_HEAD -and
            $_.base.ref -eq "main"
          })
          if ($pullRequests.Count -ne 1) {
            throw "Expected one merged main PR for $env:MERGE_COMMIT with head $env:PR_HEAD; found $($pullRequests.Count)."
          }

          "- Merged PR: #$($pullRequests[0].number)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Verify aggregate validation gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_COMMIT: ${{ steps.provenance.outputs.validation_commit }}
        run: |
          $requiredGate = "Pack preview artifact"
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(10)
          while ($true) {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:VALIDATION_COMMIT/check-runs?per_page=100"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            $checkRuns = @(($json | ConvertFrom-Json).check_runs)
            $latest = $checkRuns |
              Where-Object {
                $_.name -eq $requiredGate -and
                $_.app.slug -eq "github-actions"
              } |
              Sort-Object id -Descending |
              Select-Object -First 1

            if ($null -ne $latest -and
                $latest.status -eq "completed" -and
                $latest.conclusion -eq "success") {
              break
            }

            if ($null -ne $latest -and $latest.status -eq "completed") {
              throw "Required gate '$requiredGate' concluded '$($latest.conclusion)'."
            }

            $gateState = if ($null -eq $latest) { "missing" } else { $latest.status }
            if ([DateTimeOffset]::UtcNow -ge $deadline) {
              throw "Timed out waiting for required gate '$requiredGate' ($gateState)."
            }

            Write-Host "Waiting for '$requiredGate' on $env:VALIDATION_COMMIT ($gateState)."
            Start-Sleep -Seconds 10
          }

          "- Aggregate CI gate: ``$requiredGate`` passed on ``$env:VALIDATION_COMMIT``" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Read and validate package version
        id: package_version
        shell: bash
        run: |
          version="$(dotnet msbuild src/EffortHours.Cli/EffortHours.Cli.csproj -getProperty:Version -nologo)"
          if [[ -z "$version" || "$version" != *-* ]]; then
            echo "NuGet release requires an explicit prerelease version; received '$version'." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "NuGet release requires the exact tag 'v$version'; received '$GITHUB_REF'." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/EffortHours.Cli/EffortHours.Cli.csproj --configfile NuGet.Config --locked-mode

      - name: Pack
        run: dotnet pack src/EffortHours.Cli/EffortHours.Cli.csproj --configuration Release --no-restore --output artifacts/packages

      - name: Inspect package payload
        shell: bash
        run: |
          package="artifacts/packages/EffortHours.Tool.${{ steps.package_version.outputs.value }}.nupkg"
          test -f "$package"
          entries="$(unzip -Z1 "$package")"
          for required in \
            EffortHours.Tool.nuspec \
            LICENSE \
            PACKAGE_README.md \
            THIRD-PARTY-NOTICES.md \
            models/seed-rules/0.4.0.json \
            rates/us-senior-contractor/2026.1.json \
            tools/net10.0/any/efforthours.dll \
            tools/net10.0/any/efforthours.deps.json \
            tools/net10.0/any/efforthours.runtimeconfig.json; do
            grep -Fxq "$required" <<< "$entries"
          done
          test "$(grep -Ec '^tools/net10.0/any/[^/]+\.deps\.json$' <<< "$entries")" -eq 1
          test "$(grep -Ec '^tools/net10.0/any/[^/]+\.runtimeconfig\.json$' <<< "$entries")" -eq 1
          nuspec="$(unzip -p "$package" EffortHours.Tool.nuspec)"
          if ! grep -Fq "<releaseNotes>${{ steps.package_version.outputs.value }}:" <<< "$nuspec"; then
            echo "NuGet release notes do not begin with the exact package version." >&2
            exit 1
          fi
          if ! grep -Fq "blob/v${{ steps.package_version.outputs.value }}/CHANGELOG.md" <<< "$nuspec"; then
            echo "NuGet release notes do not link to the tag-specific changelog." >&2
            exit 1
          fi

      - name: Record package digest
        id: package_digest
        shell: bash
        run: |
          package="artifacts/packages/EffortHours.Tool.${{ steps.package_version.outputs.value }}.nupkg"
          digest="$(sha256sum "$package" | cut -d ' ' -f 1)"
          echo "value=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Release package"
            echo "- Version: \`${{ steps.package_version.outputs.value }}\`"
            echo "- SHA-256: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install and run packed tool
        shell: bash
        run: |
          dotnet tool install EffortHours.Tool \
            --tool-path artifacts/smoke-tool \
            --source "$(pwd)/artifacts/packages" \
            --configfile NuGet.Config \
            --version "${{ steps.package_version.outputs.value }}"
          artifacts/smoke-tool/eh version
          artifacts/smoke-tool/eh --help >/dev/null
          artifacts/smoke-tool/eh schema list >/dev/null

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: efforthours-tool-${{ steps.package_version.outputs.value }}
          path: artifacts/packages/EffortHours.Tool.${{ steps.package_version.outputs.value }}.nupkg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish to NuGet.org
    needs: package
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: efforthours-tool-${{ needs.package.outputs.version }}
          path: artifacts/packages

      - name: Verify approved package digest
        shell: bash
        run: |
          package="artifacts/packages/EffortHours.Tool.${{ needs.package.outputs.version }}.nupkg"
          actual="$(sha256sum "$package" | cut -d ' ' -f 1)"
          expected="${{ needs.package.outputs.digest }}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Downloaded package digest '$actual' does not match approved digest '$expected'." >&2
            exit 1
          fi

      - name: Request short-lived NuGet credential
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish immutable preview version
        shell: bash
        run: |
          dotnet nuget push \
            "artifacts/packages/EffortHours.Tool.${{ needs.package.outputs.version }}.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
